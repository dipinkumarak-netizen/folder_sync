name: folder_sync
description: Open Source FTP Backup Application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1


  # Path
  path_provider: ^2.1.5
  path: ^1.9.1

  # UUID
  uuid: ^4.5.1

  # FTP
  ftpconnect: ^2.0.7

  # Device Info
  device_info_plus: ^11.5.0
  battery_plus: ^6.2.1
  connectivity_plus: ^6.1.5

  # Folder Picker
  file_picker: ^10.3.2

  # Permissions
  permission_handler: ^12.0.1

  # Logging
  logger: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true