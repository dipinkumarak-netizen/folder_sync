name: folder_sync
description: Open Source FTP Backup Application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1


  # Storage & Archive
  path_provider: ^2.1.5
  path: ^1.9.1
  archive: ^3.6.1

  # UUID
  uuid: ^4.5.1

  # FTP & SFTP
  ftpconnect: ^2.0.7
  dartssh2: ^2.5.2

  # Device Info
  device_info_plus: ^11.5.0
  battery_plus: ^6.2.1
  connectivity_plus: ^6.1.5

  # Folder Picker
  file_picker: ^10.3.2

  # Permissions
  permission_handler: ^12.0.1
  local_auth: ^2.3.0

  # Logging
  logger: ^2.6.1
  sqflite: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
